<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>研修チェック｜営業マン記入</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Sans:wght@400;500;600&display=swap');
  :root {
    --navy:#1a3560; --navy-mid:#2a4f8a; --blue:#3a7bd5; --blue-light:#e8f0fc;
    --amber:#f5a623; --bg:#f4f6fb; --card:#fff; --text:#1a2340; --muted:#6b7a99;
    --border:#dce3f0; --r:14px; --sh:0 2px 16px rgba(26,53,96,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px;}
  .app-header{background:var(--navy);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(26,53,96,.25);}
  .header-row{display:flex;align-items:center;gap:8px;}
  .header-badge{background:var(--blue);color:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.05em;}
  .header-title{font-size:15px;font-weight:700;flex:1;}
  .progress-wrap{margin-top:8px;background:rgba(255,255,255,.15);border-radius:4px;height:4px;}
  .progress-fill{height:4px;border-radius:4px;background:var(--amber);width:0%;transition:width .4s;}
  .progress-lbl{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.6);margin-top:3px;}
  .content{max-width:600px;margin:0 auto;padding:14px 12px;}
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;}
  .card-hd{padding:11px 15px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--border);background:var(--navy);color:#fff;}
  .card-hd-title{font-size:13px;font-weight:700;flex:1;}
  .card-body{padding:14px 15px;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field-lbl{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;}
  .field-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Noto Sans JP',sans-serif;font-size:14px;color:var(--text);background:#fff;transition:border-color .2s;-webkit-appearance:none;}
  .field-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(58,123,213,.1);}
  textarea.field-input{resize:none;min-height:75px;line-height:1.6;}
  .check-item{padding:10px 0;border-bottom:1px solid #f0f3fa;}
  .check-item:last-child{border-bottom:none;}
  .check-lbl{font-size:13px;margin-bottom:7px;line-height:1.4;}
  .action-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;}
  .action-num{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:'DM Sans',sans-serif;flex-shrink:0;margin-top:3px;background:var(--blue-light);color:var(--navy);}
  .submit-area{position:fixed;bottom:0;left:0;right:0;padding:12px 14px;background:rgba(244,246,251,.96);backdrop-filter:blur(8px);border-top:1px solid var(--border);}
  .btn-submit{width:100%;padding:15px;border:none;border-radius:12px;font-family:'Noto Sans JP',sans-serif;font-size:15px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;box-shadow:0 4px 16px rgba(26,53,96,.28);transition:all .2s;-webkit-tap-highlight-color:transparent;}
  .btn-submit:active{transform:scale(.97);}
  .toast{position:fixed;top:82px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--navy);color:#fff;border-radius:20px;padding:5px 14px;font-size:12px;opacity:0;pointer-events:none;transition:all .22s;white-space:nowrap;z-index:150;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .overlay{display:none;position:fixed;inset:0;background:rgba(26,53,96,.6);z-index:200;align-items:center;justify-content:center;padding:22px;}
  .overlay.show{display:flex;}
  .overlay-card{background:#fff;border-radius:20px;padding:28px 24px;text-align:center;max-width:320px;width:100%;box-shadow:0 8px 40px rgba(26,53,96,.22);animation:pop .3s cubic-bezier(.175,.885,.32,1.275);}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .ov-icon{font-size:52px;margin-bottom:10px;}
  .ov-title{font-size:19px;font-weight:700;color:var(--navy);margin-bottom:7px;}
  .ov-msg{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:16px;}
  .ov-data{background:var(--blue-light);border-radius:10px;padding:12px;margin-bottom:16px;text-align:left;font-size:12px;color:var(--navy-mid);line-height:2;}
  .btn-close{width:100%;padding:12px;border:none;border-radius:10px;background:var(--navy);color:#fff;font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
  .spinner{display:none;width:22px;height:22px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app-header">
  <div class="header-row">
    <span class="header-badge">営業マン用</span>
    <span class="header-title">研修同行チェックシート</span>
  </div>
  <div class="progress-wrap"><div class="progress-fill" id="prog"></div></div>
  <div class="progress-lbl"><span id="progTxt">評価: 0/15項目</span><span id="scoreTxt">合計: 0/75点</span></div>
</div>
<div class="toast" id="toast"></div>

<div class="content">

  <!-- 基本情報 -->
  <div class="card">
    <div class="card-hd"><span class="card-hd-title">📅 基本情報</span></div>
    <div class="card-body">
      <div class="info-grid">
        <div><div class="field-lbl">日付</div><input class="field-input" type="date" id="date"></div>
<div><div class="field-lbl">担当者名</div><input class="field-input" id="salesName" placeholder="あなたの名前"></div>
        <div><div class="field-lbl">新人名</div><input class="field-input" id="newName" placeholder="例：やまだたろう"><div style="font-size:11px;color:#e53935;margin-top:4px;">※ フルネームひらがな・空白なしで入力してください（例：やまだたろう）</div></div>
        <div style="grid-column:1/-1"><div class="field-lbl">営業所</div>
          <select class="field-input" id="office">
            <option value="">選択してください</option>
            <option>大阪営業所</option>
            <option>名古屋営業所</option>
            <option>福岡営業所</option>
            <option>横浜営業所</option>
            <option>五反田営業所</option>
            <option>岡山店舗</option>
            <option>神戸営業所</option>
            <option>八王子営業所</option>
            <option>埼玉営業所</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-hd"><span class="card-hd-title">📝 営業マン記入欄</span></div>
    <div class="card-body" style="display:flex;flex-direction:column;gap:11px">
      <div><div class="field-lbl">教えたこと</div><textarea class="field-input" id="taught" placeholder="本日教えた内容…"></textarea></div>
      <div><div class="field-lbl">感想・改善点</div><textarea class="field-input" id="feedback" placeholder="感想や改善点…"></textarea></div>
      <div><div class="field-lbl">次の担当者へのメッセージ</div><textarea class="field-input" id="message" placeholder="次の同行者へ伝えたいこと…" style="min-height:60px"></textarea></div>
    </div>
  </div>

</div>

<div class="submit-area">
  <button class="btn-submit" id="submitBtn" onclick="doSubmit()">
    <span id="btnLbl">📋 送信する</span>
    <div class="spinner" id="spinner"></div>
  </button>
</div>

<!-- 完了オーバーレイ -->
<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="ov-icon">✅</div>
    <div class="ov-title">送信完了！</div>
    <div class="ov-msg">スプレッドシートに記録されました。お疲れさまでした！</div>
    <div class="ov-data" id="ovData"></div>
    <button class="btn-close" onclick="localStorage.removeItem('kenshu_sales_draft'); location.reload();">閉じる</button>
  </div>
</div>

<script>
// ===== Google Apps Script の URL をここに貼る =====
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwb1VPitNyl5SIfyEuiX0sDbU4qTCUqa3lRQO_2cFCDBcFeeonFHj95hL-uJp2ASp6oag/exec';
// ================================================



function showToast(txt) {
  const t = document.getElementById('toast');
  t.textContent = txt; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1300);
}

async function doSubmit() {
  const dateRaw = document.getElementById('date').value;
  if (!dateRaw) { showToast('⚠️ 日付を選択してください'); return; }
  const dateParts = dateRaw.split('-');
  const date = parseInt(dateParts[1]) + '/' + parseInt(dateParts[2]);
  const sName = document.getElementById('salesName').value.trim();
  const nName = document.getElementById('newName').value.trim();
  const office = document.getElementById('office').value;
  const taught = document.getElementById('taught').value.trim();
  const feedback = document.getElementById('feedback').value.trim();
  const message = document.getElementById('message').value.trim();
  let emptyFields = [];
  if(!sName) emptyFields.push('担当者名');
  if(!nName) emptyFields.push('新人名');
  if(!office) emptyFields.push('営業所');
  if(!taught) emptyFields.push('教えたこと');
  if(!feedback) emptyFields.push('感想・改善点');
  if(!message) emptyFields.push('次の担当者へのメッセージ');
  if(emptyFields.length > 0){
    showToast('⚠️ 未入力: ' + emptyFields.join('・')); return;
  }

  document.getElementById('btnLbl').style.display='none';
  document.getElementById('spinner').style.display='block';

  const payload = {
    type: 'sales',
    submittedAt: new Date().toLocaleString('ja-JP'),
    date: date, salesName: sName, newName: nName, office: office,
    scores: '{}', scoreGreeting: 0, scoreAppearance: 0, scoreManner: 0, scoreTotal: 0,
    taught: taught, feedback: feedback, message: message
  };

  const fd = new FormData();
  fd.append('data', JSON.stringify(payload));

  try {
    await fetch(GAS_URL, { method: 'POST', body: fd, mode: 'no-cors' });
  } catch(e) {}

  document.getElementById('btnLbl').style.display='block';
  document.getElementById('spinner').style.display='none';

  document.getElementById('ovData').innerHTML =
    '📅 ' + date + '<br>👔 担当者: ' + sName + '<br>🌱 新人: ' + nName;
  document.getElementById('overlay').classList.add('show');
  window._clearDraft && window._clearDraft(); setTimeout(function(){ location.reload(); }, 3000);
}

// 自動保存・復元機能
(function() {
  const SAVE_KEY = 'kenshu_sales_draft';
  function saveForm() {
    const data = {};
    document.querySelectorAll('input[id], select[id], textarea[id]').forEach(function(el) {
      data[el.id] = el.value;
    });
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  }
  function restoreForm() {
    const saved = localStorage.getItem(SAVE_KEY);
    if (!saved) return;
    try {
      const data = JSON.parse(saved);
      Object.keys(data).forEach(function(id) {
        const el = document.getElementById(id);
        if (el && data[id]) el.value = data[id];
      });
    } catch(e) {}
  }
  document.addEventListener('input', saveForm);
  document.addEventListener('change', saveForm);
  window.addEventListener('load', restoreForm);
  window._clearDraft = function() { localStorage.removeItem(SAVE_KEY); };
})();
</script>
</body>
</html>
